name: Build Windows (portable exe, Windows 7+)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"       # последний Python с поддержкой Windows 7
          architecture: x86
      - name: RTL-SDR DLL (готовая Windows-сборка драйвера)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force dlls | Out-Null
          $log = New-Object System.Collections.Generic.List[string]
          function L($m) { Write-Host $m; $log.Add([string]$m) }
          $urls = @(
            "https://github.com/rtlsdrblog/rtl-sdr-blog/releases/download/1.01/Release.zip",
            "https://github.com/rtlsdrblog/rtl-sdr-blog/releases/download/1.0/Release.zip",
            "https://ftp.osmocom.org/binaries/windows/rtl-sdr/rtl-sdr-release.zip"
          )
          $n = 0
          foreach ($u in $urls) {
            if ((Test-Path dlls\rtlsdr.dll) -or (Test-Path dlls\librtlsdr.dll)) { break }
            $n++; $zip = "dl$n.zip"; $dir = "dl$n"
            try {
              Invoke-WebRequest $u -OutFile $zip -UseBasicParsing
              Expand-Archive $zip -DestinationPath $dir -Force
              $all = Get-ChildItem $dir -Recurse -Include *.dll
              L "$u -> dll: $(($all | ForEach-Object { $_.FullName.Substring($PWD.Path.Length) }) -join ', ')"
              $pick = $all | Where-Object { $_.Name -match '^(lib)?rtlsdr\.dll$' } | Select-Object -First 1
              if ($pick) {
                $b = [IO.File]::ReadAllBytes($pick.FullName); $pe = [BitConverter]::ToInt32($b,0x3C); $mach = [BitConverter]::ToUInt16($b,$pe+4)
                L ("{0}: machine=0x{1:x}" -f $pick.FullName, $mach)
                if ($mach -ne 0x14c) { continue }
                Copy-Item "$($pick.Directory.FullName)\*.dll" dlls\ -Force
              }
            } catch { L "$u : $($_.Exception.Message)" }
          }
          Get-ChildItem dlls | ForEach-Object { L "dlls: $($_.Name)" }
          if (-not ((Test-Path dlls\rtlsdr.dll) -or (Test-Path dlls\librtlsdr.dll))) {
            $msg = ($log -join "%0A")
            Write-Host "::error title=DLL::$msg"
            exit 1
          }
          if (-not (Test-Path dlls\libusb-1.0.dll)) { Write-Host "::error title=DLL::libusb-1.0.dll не найдена. $($log -join '%0A')"; exit 1 }
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25" 2>&1 | Tee-Object -FilePath build.log -Append
          pip install -r requirements-build.txt 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Self-test
        shell: pwsh
        continue-on-error: true   # таймингозависимые проверки не должны блокировать сборку
        run: |
          python selftest.py 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name MarineVHF --icon app.ico --collect-all sounddevice --hidden-import lameenc --exclude-module matplotlib --exclude-module pandas --exclude-module IPython --exclude-module pytest --exclude-module scipy --exclude-module PIL app.py 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item dlls\*.dll dist\MarineVHF\
          Copy-Item README.md, OpenCPN_start.bat, "OpenCPN.txt" dist\MarineVHF\
          Compress-Archive -Path dist\MarineVHF -DestinationPath MarineVHF-win7plus.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MarineVHF-win7plus
          path: MarineVHF-win7plus.zip
      - name: Publish log and exe to branch build-out
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path build.log) { Copy-Item build.log out\build.log }
          if (Test-Path MarineVHF-win7plus.zip) { Copy-Item MarineVHF-win7plus.zip out\ }
          Set-Location out
          git init -q -b build-out
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -qm "build $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-out
