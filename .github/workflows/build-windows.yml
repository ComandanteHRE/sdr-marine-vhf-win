name: Build Windows (portable exe, Windows 7+)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"       # последний Python с поддержкой Windows 7
          architecture: x64
      - name: RTL-SDR DLL (готовая Windows-сборка драйвера)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dlls | Out-Null
          # источники по очереди: RTL-SDR Blog (работает со всеми ключами, включая V3/V4), librtlsdr, osmocom
          $sources = @(
            @{ repo = "rtlsdrblog/rtl-sdr-blog"; pattern = "*.zip" },
            @{ repo = "librtlsdr/librtlsdr";     pattern = "*64*.zip" },
            @{ repo = "osmocom/rtl-sdr";         pattern = "*.zip" }
          )
          $done = $false
          foreach ($s in $sources) {
            if ($done) { break }
            $dir = "dl_" + ($s.repo -replace "/", "_")
            New-Item -ItemType Directory -Force $dir | Out-Null
            Write-Host "== $($s.repo)"
            gh release download --repo $s.repo --pattern $s.pattern --dir $dir 2>&1 | Write-Host
            foreach ($z in Get-ChildItem $dir -Filter *.zip -ErrorAction SilentlyContinue) {
              Expand-Archive $z.FullName -DestinationPath "$dir\x\$($z.BaseName)" -Force
            }
            $cands = Get-ChildItem "$dir\x" -Recurse -Include rtlsdr.dll, librtlsdr.dll -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "x64|w64|win64|64" }
            $pick = $cands | Select-Object -First 1
            if ($pick) {
              Write-Host "найдена: $($pick.FullName)"
              Copy-Item "$($pick.Directory.FullName)\*.dll" dlls\ -Force
              if (-not (Test-Path dlls\libusb-1.0.dll)) {
                $u = Get-ChildItem "$dir\x" -Recurse -Filter libusb-1.0.dll | Where-Object { $_.FullName -match "x64|w64|win64|64" } | Select-Object -First 1
                if ($u) { Copy-Item $u.FullName dlls\ -Force }
              }
              $done = $true
            }
          }
          Get-ChildItem dlls
          if (-not ((Test-Path dlls\rtlsdr.dll) -or (Test-Path dlls\librtlsdr.dll))) { throw "Не удалось получить x64 DLL RTL-SDR ни из одного источника" }
          if (-not (Test-Path dlls\libusb-1.0.dll)) { throw "Не найдена libusb-1.0.dll" }
      - name: Install
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r requirements-build.txt
      - name: Self-test
        run: python selftest.py
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name MarineVHF --icon app.ico
          --collect-all sounddevice --hidden-import lameenc
          --exclude-module matplotlib --exclude-module pandas --exclude-module IPython --exclude-module pytest
          --exclude-module scipy --exclude-module PIL app.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item dlls\*.dll dist\MarineVHF\
          Copy-Item README.md, OpenCPN_start.bat, "OpenCPN.txt" dist\MarineVHF\
          Compress-Archive -Path dist\MarineVHF -DestinationPath MarineVHF-win7plus-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MarineVHF-win7plus-x64
          path: MarineVHF-win7plus-x64.zip
